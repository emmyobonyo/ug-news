name: Refresh Uganda digest

on:
  schedule:
    # Runs daily at 7:00 AM UTC (10:00 AM Kampala time). Adjust as needed.
    - cron: "0 7 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run scraper
        run: python scrape_monitor.py

      - name: Commit updated digest.json
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add digest.json
          git diff --staged --quiet || git commit -m "Refresh digest $(date -u +%Y-%m-%d)"
          git push
